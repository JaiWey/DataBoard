<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DataBoard on AWS (EC2 free tier)</title>
  <desc id="d">People reach an Elastic IP on one EC2 server, where Caddy passes HTTPS requests to the self-contained DataBoard service, which uses a private RDS PostgreSQL database. A deploy script on your PC uploads a release archive to S3 and uses Systems Manager to make the server run it; the server reads its secrets from Parameter Store.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1971c2"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e8590c"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5c6670"/></marker>
    <style>
      .t { font-size: 13px; fill: #1b2733; }
      .s { font-size: 11px; fill: #5c6670; }
      .h { font-size: 13px; font-weight: 600; fill: #1b2733; }
      .lab { font-size: 11px; font-weight: 600; }
      .box { fill: #fff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#f7f9fb"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#1b2733">DataBoard on AWS: one EC2 server, free tier</text>
  <text x="20" y="54" class="s">Blue: people's traffic. Orange: a deploy. Grey: what the server reads or reaches.</text>

  <!-- ============ left column ============ -->
  <rect class="box" x="20" y="80" width="210" height="130" rx="8" stroke="#e8590c"/>
  <text x="32" y="100" class="h">Your PC: infra/deploy.ps1</text>
  <text x="32" y="122" class="t">1  dotnet publish: self-contained</text>
  <text x="32" y="138" class="t">    Linux build, web app inside</text>
  <text x="32" y="158" class="t">2  tar.gz the build</text>
  <text x="32" y="178" class="t">3  upload it to S3</text>
  <text x="32" y="198" class="t">4  ask Systems Manager to run it</text>

  <rect class="box" x="20" y="250" width="210" height="64" rx="8" stroke="#1971c2"/>
  <text x="32" y="272" class="h">People (a browser)</text>
  <text x="32" y="292" class="s">https://&lt;your name&gt;  or  &lt;ip&gt;.sslip.io</text>

  <rect class="box" x="20" y="360" width="210" height="64" rx="8" stroke="#5c6670" stroke-dasharray="5 4"/>
  <text x="32" y="382" class="h">Let's Encrypt</text>
  <text x="32" y="402" class="s">free certificate, renewed by Caddy</text>

  <rect class="box" x="20" y="470" width="210" height="64" rx="8" stroke="#5c6670" stroke-dasharray="5 4"/>
  <text x="32" y="492" class="h">Your own databases</text>
  <text x="32" y="512" class="s">data sources people add (internet)</text>

  <!-- ============ AWS region ============ -->
  <rect x="262" y="72" width="818" height="628" rx="10" fill="#fff" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="276" y="92" class="h" fill="#232f3e">AWS region (ap-southeast-2, Sydney, by default)</text>

  <!-- VPC -->
  <rect x="280" y="130" width="512" height="556" rx="8" fill="#f6faee" stroke="#7aa116" stroke-width="1.5"/>
  <text x="292" y="150" class="h">Default VPC: public subnets, no NAT gateway, no load balancer</text>

  <!-- Elastic IP -->
  <rect class="box" x="290" y="218" width="84" height="44" rx="6" stroke="#1971c2"/>
  <text x="332" y="237" text-anchor="middle" class="h">Elastic IP</text>
  <text x="332" y="252" text-anchor="middle" class="s">ports 80, 443</text>

  <!-- EC2 -->
  <rect x="396" y="162" width="384" height="318" rx="8" fill="#fff8f1" stroke="#ed7100" stroke-width="1.5"/>
  <text x="408" y="182" class="h">EC2 t3.micro: Amazon Linux 2023, 1 GB + 1 GB swap</text>
  <text x="408" y="198" class="s">no SSH: shell and commands through Systems Manager</text>

  <rect class="box" x="410" y="212" width="150" height="86" rx="6" stroke="#1971c2"/>
  <text x="422" y="232" class="h">Caddy</text>
  <text x="422" y="250" class="t">systemd service</text>
  <text x="422" y="266" class="t">HTTPS, certificate,</text>
  <text x="422" y="282" class="t">gzip, forwards requests</text>

  <rect class="box" x="616" y="212" width="150" height="86" rx="6" stroke="#1971c2"/>
  <text x="628" y="232" class="h">DataBoard</text>
  <text x="628" y="250" class="t">systemd service</text>
  <text x="628" y="266" class="t">self-contained .NET,</text>
  <text x="628" y="282" class="t">web app inside</text>

  <rect class="box" x="410" y="352" width="150" height="104" rx="6" stroke="#5c6670"/>
  <text x="422" y="372" class="h">/opt/databoard</text>
  <text x="422" y="390" class="t">release.sh, configure.sh</text>
  <text x="422" y="406" class="t">releases/ (the last 3)</text>
  <text x="422" y="422" class="t">app, symlink to the</text>
  <text x="422" y="438" class="t">running release</text>

  <rect class="box" x="616" y="352" width="150" height="104" rx="6" stroke="#5c6670"/>
  <text x="628" y="372" class="h">Data disk (EBS)</text>
  <text x="628" y="390" class="t">10 GB, encrypted</text>
  <text x="628" y="406" class="t">uploaded CSV data,</text>
  <text x="628" y="422" class="t">encryption keys,</text>
  <text x="628" y="438" class="t">certificates</text>
  <text x="628" y="452" class="s">outlives the server</text>

  <!-- RDS -->
  <rect x="396" y="540" width="384" height="124" rx="8" fill="#f1f3fd" stroke="#3b48cc" stroke-width="1.5"/>
  <text x="408" y="562" class="h">RDS PostgreSQL 17</text>
  <text x="408" y="582" class="t">db.t4g.micro, one zone, 20 GB gp2, encrypted</text>
  <text x="408" y="600" class="t">1 day of automated backups (free plan)</text>
  <text x="408" y="618" class="t">no public address; its security group lets in only the server</text>
  <text x="408" y="642" class="s">stays inside the RDS free tier (checked by Terraform)</text>

  <!-- services column -->
  <rect class="box" x="812" y="130" width="190" height="64" rx="8" stroke="#8c4fff"/>
  <text x="824" y="152" class="h">S3 bucket</text>
  <text x="824" y="170" class="t">release archives</text>
  <text x="824" y="185" class="s">private; deleted after 30 days</text>

  <rect class="box" x="812" y="226" width="190" height="64" rx="8" stroke="#8c4fff"/>
  <text x="824" y="248" class="h">Systems Manager</text>
  <text x="824" y="266" class="t">run command, shell</text>
  <text x="824" y="281" class="s">instead of SSH</text>

  <rect class="box" x="812" y="322" width="190" height="78" rx="8" stroke="#8c4fff"/>
  <text x="824" y="344" class="h">Parameter Store</text>
  <text x="824" y="362" class="t">database connection string,</text>
  <text x="824" y="378" class="t">token key, GitHub keys</text>
  <text x="824" y="393" class="s">SecureString, free</text>

  <rect class="box" x="812" y="436" width="190" height="52" rx="8" stroke="#8c4fff" stroke-dasharray="5 4"/>
  <text x="824" y="458" class="h">AWS Budgets (optional)</text>
  <text x="824" y="476" class="s">email when the cost nears a limit</text>

  <rect class="box" x="812" y="504" width="190" height="52" rx="8" stroke="#8c4fff" stroke-dasharray="5 4"/>
  <text x="824" y="526" class="h">Route 53 (optional)</text>
  <text x="824" y="544" class="s">the A record, if your domain is here</text>

  <!-- ============ arrows ============ -->
  <!-- people -> Elastic IP -> Caddy -> DataBoard -->
  <path d="M230 240 L288 240" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="236" y="232" class="lab" fill="#1971c2">HTTPS</text>
  <path d="M374 240 L408 240" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <path d="M560 256 L614 256" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="563" y="249" class="lab" fill="#1971c2">:8080</text>

  <!-- DataBoard -> data disk, EC2 -> RDS -->
  <path d="M691 298 L691 350" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <path d="M588 480 L588 538" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="598" y="514" class="lab" fill="#1971c2">PostgreSQL 5432 (TLS)</text>

  <!-- Let's Encrypt, other databases -->
  <path d="M230 392 L394 392" stroke="#5c6670" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#grey)"/>
  <text x="262" y="384" class="lab" fill="#5c6670">certificate (ACME)</text>
  <path d="M394 430 L246 490 L232 496" stroke="#5c6670" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#grey)"/>
  <text x="262" y="448" class="lab" fill="#5c6670">queries to data sources</text>

  <!-- deploy: PC -> S3 and Systems Manager, along the top -->
  <path d="M230 104 L907 104 L907 128" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="520" y="99" class="lab" fill="#e8590c">3  upload the archive</text>
  <path d="M230 124 L1030 124 L1030 258 L1004 258" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="700" y="119" class="lab" fill="#e8590c">4  run release.sh</text>

  <!-- the server reads from the services -->
  <path d="M810 162 L782 190" stroke="#5c6670" stroke-width="1.5" fill="none" marker-end="url(#grey)"/>
  <path d="M810 258 L782 250" stroke="#5c6670" stroke-width="1.5" fill="none" marker-end="url(#grey)"/>
  <path d="M810 361 L782 330" stroke="#5c6670" stroke-width="1.5" fill="none" marker-end="url(#grey)"/>
  <text x="792" y="116" class="s" text-anchor="middle"> </text>

  <!-- ============ legend ============ -->
  <rect class="box" x="20" y="580" width="210" height="104" rx="8" stroke="#c9d1d9"/>
  <text x="32" y="600" class="h">How it works</text>
  <text x="32" y="620" class="t">A deploy unpacks the release,</text>
  <text x="32" y="636" class="t">switches the symlink, restarts</text>
  <text x="32" y="652" class="t">the service and waits for</text>
  <text x="32" y="668" class="t">/api/health to answer.</text>
</svg>
