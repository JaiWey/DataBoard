# Local development database. Not for production.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the data volume)
services:
  postgres:
    image: postgres:17
    container_name: databoard-postgres
    environment:
      POSTGRES_DB: databoard
      POSTGRES_USER: databoard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databoard_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - databoard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databoard -d databoard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  databoard-pgdata:
